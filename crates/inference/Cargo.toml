[package]
name    = "inference"
version.workspace = true
edition.workspace = true

[dependencies]
feature-extractor = { path = "../feature-extractor" }
serde     = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }
anyhow    = { workspace = true }
rusqlite  = { workspace = true }
sha2      = { workspace = true }
hex       = { workspace = true }

# ONNX Runtime — load-dynamic so ORT shared lib is loaded at runtime, not statically linked.
# Optional: only compiled when --features onnx is passed. The default build works without ORT.
ort = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
# Enable to build ONNX model inference (requires ORT shared library at runtime)
onnx = ["dep:ort"]
